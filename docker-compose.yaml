version: '3.8'

services:
  # База данных PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: subscription_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: subscriptions_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscriptions_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Контейнер для автоматического применения SQL миграций
  migrations:
    image: migrate/migrate
    container_name: subscription_migrations
    volumes:
      - ./migrations:/migrations
    # Передаем параметры подключения к нашей БД
    command: -path=/migrations -database "postgres://postgres:secret@postgres_db:5432/subscriptions_db?sslmode=disable" up
    depends_on:
      postgres_db:
        condition: service_healthy # Ждем, пока Postgres будет полностью готов принимать подключения

  # Наше Go-приложение
  app_service:
    build: .
    container_name: subscription_app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=production
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=subscriptions_db
      - DB_SSLMODE=disable
      - RATE_LIMIT_RPS=10.0
      - RATE_LIMIT_BURST=20
    depends_on:
      postgres_db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully # Начинаем запуск приложения только ПОСЛЕ успешного наката всех миграций

volumes:
  pgdata:
